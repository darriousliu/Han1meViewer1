# 打 v* 标签时构建四端产物，并汇总成一份草稿 Release。
# 构建本身复用 build.yml（与 push / PR 走的是同一份实现），这里只多一步汇总。
name: Release Builds

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      platforms:
        description: "要构建的平台：all，或逗号分隔的 android,ios,windows,macos"
        default: "all"
        required: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      platforms: ${{ inputs.platforms || 'all' }}
    secrets: inherit

  release:
    name: 汇总并创建 Release
    needs: build
    # 手动触发只出产物，不建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 汇总产物
        # Android / iOS 仍按 tag 改名；桌面产物**必须保持原名**——latest*.yml 里的 url
        # 字段就是这些文件名，改名之后更新器会 404。名字本身已经由 :desktopApp 的
        # artifactName 模板出成 Han1meViewer-<version>-<os>-<arch>.<ext> 了。
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p release
          cp artifacts/android-apk/*.apk "release/Han1meViewer-${TAG}-android-arm64-v8a.apk"
          cp artifacts/ios-ipa/*.ipa     "release/Han1meViewer-${TAG}-ios.ipa"
          # 桌面：安装包、免安装包、差分索引，原样搬。
          # 用通配而不写死子目录名（nsis/ zip/ dmg/）：那是 Nucleus 按格式分的目录，
          # 换格式或换版本都可能变，写死一次就要为一个路径重跑一整轮构建。
          cp artifacts/windows-desktop/*/*.exe release/
          cp artifacts/windows-desktop/*/*.zip release/
          cp artifacts/macos-desktop/*/*.dmg   release/
          cp artifacts/macos-desktop/*/*.zip   release/
          find artifacts -name '*.blockmap' -exec cp {} release/ \;
          # Windows 的更新清单叫 latest.yml，只有安装包那个格式会生成一份
          # （Zip 只在 macOS 上出清单），所以这里最多命中一个
          find artifacts/windows-desktop -name 'latest.yml' -exec cp {} release/ \;
          test -f release/latest.yml || { echo '没找到 Windows 的 latest.yml，自动更新会失效'; exit 1; }
          ls -lh release

      - name: 合并 macOS 的更新清单
        # dmg/ 与 zip/ 各生成一份 latest-mac.yml，各自只列自己那个文件，直接传上去会互相覆盖。
        # 更新器需要的是一份同时列出两者的清单：首装用 dmg，自动更新时从 zip 里静默替换 .app，
        # 所以顶层的 path/sha512 指向 zip。
        run: |
          python3 - <<'PY'
          import re, pathlib

          def parse(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              url = re.search(r"^\s*-\s*url:\s*(\S+)", text, re.M).group(1)
              sha = re.search(r"^\s*sha512:\s*(\S+)", text, re.M).group(1)
              size = re.search(r"^\s*size:\s*(\d+)", text, re.M).group(1)
              version = re.search(r"^version:\s*(\S+)", text, re.M).group(1)
              date = re.search(r"^releaseDate:\s*(.+)$", text, re.M).group(1).strip()
              return dict(url=url, sha=sha, size=size, version=version, date=date)

          # 同样不写死子目录：按清单里列的文件后缀区分哪份是 dmg、哪份是 zip
          found = {}
          for f in sorted(pathlib.Path("artifacts/macos-desktop").rglob("latest-mac.yml")):
              e = parse(f)
              found[pathlib.Path(e["url"]).suffix.lstrip(".")] = e
          dmg, zip_ = found["dmg"], found["zip"]
          assert dmg["version"] == zip_["version"], (dmg["version"], zip_["version"])

          merged = "\n".join([
              f"version: {zip_['version']}",
              "files:",
              *[l for e in (dmg, zip_) for l in (
                  f"  - url: {e['url']}",
                  f"    sha512: {e['sha']}",
                  f"    size: {e['size']}",
              )],
              f"path: {zip_['url']}",
              f"sha512: {zip_['sha']}",
              f"releaseDate: {zip_['date']}",
          ]) + "\n"
          pathlib.Path("release/latest-mac.yml").write_text(merged, encoding="utf-8")
          print(merged)
          PY

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Han1meViewer ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: release/*
          body: |
            Han1meViewer ${{ github.ref_name }}

            | 平台 | 产物 | 说明 |
            | --- | --- | --- |
            | Android | `*-android-arm64-v8a.apk` | 仅 arm64-v8a |
            | iOS | `*-ios.ipa` | 未用开发者证书签名，需自行重签后侧载 |
            | Windows | `*-win-x64.exe` / `*-win-x64.zip` | exe 为 NSIS 安装包（支持覆盖升级与差分自动更新），zip 为免安装版 |
            | macOS | `*-mac-arm64.dmg` / `*-mac-arm64.zip` | Apple 芯片；dmg 用于首装，zip 是自动更新用的，别手动下 |

            `latest*.yml` 与 `*.blockmap` 是桌面端自动更新用的元数据，请勿删除。

            > macOS 未公证，首次打开需 `xattr -dr com.apple.quarantine /Applications/Han1meViewer.app`
