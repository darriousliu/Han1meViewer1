permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        # 只跑 Linux 上能跑的目标：iOS 目标需要 macOS + Xcode，
        # 在 ubuntu runner 上必然失败。iOS 壳在本地 macOS 上验证。
        run: ./gradlew :app:assembleDebug :shared:compileKotlinJvm :desktopApp:compileKotlin -x lint
