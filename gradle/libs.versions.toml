[versions]
koin = "4.2.2"
# 不能跟 koin 一起升到 4.2.x：koin-ksp-compiler 根本没有 4.x 线（最新稳定就是 2.3.1），
# 而它生成的 KoinMeta 会 import org.koin.meta.annotations —— 那 5 个类只存在于
# koin-annotations 的 2.3.x，4.2.2 里已经没有了。注解与处理器必须同为 2.3.1。
# 同理不要引 koin-bom，BOM 会把 koin-annotations 顶到 4.2.x。
koinAnnotations = "2.3.1"
# SDK
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"
# Plugins
aboutlibraries = "15.1.1"
htmlconverter = "1.1.1"
androidGradle = "9.3.1"
biometric = "1.1.0"
coilCompose = "3.5.0"
coreSplashscreen = "1.2.0"
documentFile = "1.1.0"
glance = "1.1.1"
kotlin = "2.4.10"
# 暂时停在 1.11 线：composewebview(1.0.0-beta-02，已是最新)编译在 Compose 1.10，
# 而 SwingPanel(background: Color, ...) 在 1.12.0-beta01 改成了 Color?，旧签名
# SwingPanel-euL9pac 直接消失，桌面端一进 WebView 就 NoSuchMethodError。
# 等库跟进 1.12 之后再升，升级时先跑一遍桌面的登录页与过盾页，
# 并复查 desktopApp/Main.kt 里那句关闭无障碍的 compose.accessibility.enable
#（1.11.1 的桌面 a11y 有空指针，进登录页必崩）。
# 注意 Android 侧的 composeBom / compose-material3 不受这里影响，保持最新。
composeMultiplatform = "1.11.1"
composeMultiplatformMaterial3 = "1.11.0-alpha07"
ksp = "2.3.11"
# Dependencies
core = "1.19.0"
appcompat = "1.8.0"
coroutines = "1.11.0"
activity = "1.13.0"
fragment = "1.9.0"
lifecycle = "2.11.0"
room = "3.0.1"
sqlite = "2.7.0"
navigation3 = "1.2.0-alpha07"
nav3Jb = "1.2.0-alpha02"
sonner = "0.4.0"
kermit = "2.1.0"
mpStools = "1.6.3"
work = "2.11.2"
datastore = "1.2.1"
filekit = "0.15.0"
datetime = "0.8.0"
serialization = "1.11.0"
ksoup = "0.2.6"
ktor = "3.5.2"
ktorfit = "2.7.5"
okhttp = "5.5.0"
testJunit = "1.3.0"
guava = "33.7.1-android"
exoplayer = "1.11.0"
desugarJdkLibs = "2.1.5"
composeBom = "2026.08.00"
compose-material3 = "1.5.0-alpha26"
webview = "1.0.0-beta-02"
composeMediaPlayer = "0.11.4"
kotlinxIo = "0.9.1"
material3Adaptive = "1.3.0"
jbMaterial3Adaptive = "1.3.0-beta02"
mpv = "v0.1.7"
m3color = "2026.7.27"
benManes = "0.61.0"
buildKonfig = "0.22.0"

[libraries]
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koinAnnotations" }
koin-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koinAnnotations" }
# Android
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
jb-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3Jb" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coilCompose" }
core = { group = "androidx.core", name = "core", version.ref = "core" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# Jetpack
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
# 下面两个是 KMP 制品，给 commonMain 用（viewModel() / collectAsStateWithLifecycle）
lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
jb-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
jb-lifecycle-viewmodel-savedstate = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
jb-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
jb-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
jb-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room" }
sonner = { module = "io.github.dokar3:sonner", version.ref = "sonner" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
mp-stools = { module = "io.github.darriousliu:mp_stools", version.ref = "mpStools" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }
datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
filekit-coil = { module = "io.github.vinceglb:filekit-coil", version.ref = "filekit" }
# Compose
compose-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-ui-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
kyant-m3color = { group = "io.github.darriousliu", name = "m3color", version.ref = "m3color" }
# Compose Multiplatform（commonMain 专用；androidx.compose.* 只有 Android 变体，进不了 commonMain）
compose-multiplatform-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-multiplatform-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-multiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# CMP 的 ui 模块本身没有 backhandler 包，要单独引这个才有 androidx.compose.ui.backhandler.BackHandler
compose-multiplatform-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
compose-multiplatform-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-multiplatform-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-multiplatform-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
material3-window-size = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "compose-material3" }
jetbrains-material3-window-size = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "composeMultiplatformMaterial3" }
material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
jetbrains-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "jbMaterial3Adaptive" }
# CMP WebView（Android=WebView / iOS=WKWebView / desktop=Nucleus Tao）。登录页和过盾页用。
compose-webview-multiplatform = { module = "io.github.kdroidfilter:composewebview", version.ref = "webview" }
compose-media-player = { module = "io.github.kdroidfilter:composemediaplayer", version.ref = "composeMediaPlayer" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
# Compose Desktop 的事件循环在 Swing EDT 上，没有它 Dispatchers.Main 无实现
coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

# Parse
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# Jsoup 的 KMP 替代，API 基本同名同形
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }

# Network
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktorfit-lib-light = { module = "de.jensklingenberg.ktorfit:ktorfit-lib-light", version.ref = "ktorfit" }
ktorfit-ksp = { module = "de.jensklingenberg.ktorfit:ktorfit-ksp", version.ref = "ktorfit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-dns-over-https = { group = "com.squareup.okhttp3", name = "okhttp-dnsoverhttps", version.ref = "okhttp" }

# Test
test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testJunit" } # androidTestImplementation

# video
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoplayer" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "exoplayer" }
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "exoplayer" }
mpv-lib = { group = "com.github.abdallahmehiz", name = "mpv-android", version.ref = "mpv" }

# Other
datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }
htmlconverter = { module = "be.digitalia.compose.htmlconverter:htmlconverter", version.ref = "htmlconverter" }

androidx-ui = { group = "androidx.compose.ui", name = "ui" }

[bundles]
koin = ["koin-core", "koin-annotations"]
koin-compose = ["koin-compose", "koin-compose-viewmodel"]

lifecycle = [
    "lifecycle-viewmodel",
    "lifecycle-viewmodel-savedstate",
    "lifecycle-viewmodel-compose",
    "lifecycle-runtime-compose",
]

jb-lifecycle = [
    "jb-lifecycle-viewmodel",
    "jb-lifecycle-viewmodel-savedstate",
    "jb-lifecycle-viewmodel-compose",
    "jb-lifecycle-runtime-compose",
]

# CMP 基础一圈，KMP 模块的 commonMain 起步依赖
compose-multiplatform = [
    "compose-multiplatform-runtime",
    "compose-multiplatform-foundation",
    "compose-multiplatform-ui",
    "compose-multiplatform-ui-backhandler",
    "compose-multiplatform-ui-tooling-preview",
    "compose-multiplatform-resources",
    "compose-multiplatform-material3",
    "jetbrains-material3-window-size",
    "jetbrains-material3-adaptive",
    "compose-webview-multiplatform",
]

android-base = [
    "core",
    "appcompat",
    "coroutines-android"
]

android-jetpack = [
    "activity", "fragment",
    "work-runtime", "guava"
]

filekit = ["filekit-core", "filekit-dialogs", "filekit-dialogs-compose", "filekit-coil"]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# AGP 9 的 KMP 库插件，替代老的 com.android.library + androidTarget() 组合
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
com-android-application = { id = "com.android.application", version.ref = "androidGradle" }
com-google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
org-jetbrains-kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
org-jetbrains-kotlin-plugin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
ben-manes = { id = "com.github.ben-manes.versions", version.ref = "benManes" }
# AGP 的 KMP 库插件没有 buildFeatures.buildConfig，BuildConfig 只能靠它生成
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildKonfig" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
